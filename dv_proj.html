<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Power BI Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        /* Main Container */
        .dashboard-container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        /* Header Section */
        .header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 25px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header h1::before {
            content: "📊";
            font-size: 32px;
        }

        /* Sticker Style Last Refreshed */
        .sticker {
            background: #ffd700;
            color: #333;
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            animation: pulse 2s infinite;
        }

        .sticker::before {
            content: "🕐";
            font-size: 18px;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* iframe Container */
        .iframe-wrapper {
            padding: 20px;
            background: #f5f5f5;
        }

        iframe {
            width: 100%;
            height: 600px;
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            background: white;
        }

        /* Footer */
        .footer {
            background: #f8f9fa;
            padding: 15px 30px;
            text-align: center;
            border-top: 1px solid #e0e0e0;
            font-size: 12px;
            color: #666;
        }

        .footer a {
            color: #2a5298;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        /* Refresh Note */
        .refresh-note {
            background: #e8f4fd;
            border-left: 4px solid #2a5298;
            padding: 10px 20px;
            margin: 10px 20px 0 20px;
            border-radius: 8px;
            font-size: 13px;
            color: #555;
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                text-align: center;
            }
            .sticker {
                padding: 8px 16px;
                font-size: 12px;
            }
            iframe {
                height: 400px;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <!-- Header with Title and Sticker -->
        <div class="header">
            <h1>Sales Performance Dashboard</h1>
            <div class="sticker" id="sticker">
                🔄 Loading refresh time...
            </div>
        </div>

        <!-- iframe - Power BI Report -->
        <div class="iframe-wrapper">
            <iframe 
                src="https://app.powerbi.com/reportEmbed?reportId=393aef0e-c463-4fd2-9a18-fded580e3d9a&autoAuth=true&ctid=b0eeb88f-a842-482d-a9c0-d374ec25ff27"
                title="Power BI Dashboard">
            </iframe>
        </div>

        <!-- Refresh Information Note -->
        <div class="refresh-note">
            💡 <strong>Note:</strong> Data refreshes in real-time (DirectQuery mode). Last refreshed time shows current server time when you load this page.
        </div>

        <!-- Footer -->
        <div class="footer">
            📌 <strong>Power BI Dashboard</strong> | 
            🔐 Secure Embed - Login Required | 
            📅 <span id="footerDate"></span>
        </div>
    </div>

    <script>
        // Function to show current EST time in sticker
        function updateRefreshTime() {
            const now = new Date();
            
            // Convert to EST (UTC-5 normally, but check for DST)
            // Simple approach: use toLocaleString with EST timezone
            const options = {
                timeZone: 'America/New_York',
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            };
            
            const estTime = new Date().toLocaleString('en-US', options);
            
            // Format as: DD/MM/YYYY\HH:MM
            const formatted = estTime.replace(/\//g, '-').replace(',', '\\');
            
            // Update both sticker and footer
            document.getElementById('sticker').innerHTML = `⏱️ Last Refreshed: ${formatted}`;
        }
        
        // Update footer date
        function updateFooterDate() {
            const today = new Date();
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('footerDate').innerText = today.toLocaleDateString('en-US', options);
        }
        
        // Run on page load
        updateRefreshTime();
        updateFooterDate();
        
        // Optional: Auto refresh the sticker every minute
        setInterval(updateRefreshTime, 60000);
    </script>
</body>
</html>
